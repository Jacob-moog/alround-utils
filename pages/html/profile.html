<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>loopos</title>
  <link rel="stylesheet" href="../css/profile.css">




  <script src="https://kit.fontawesome.com/1c25584323.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>


  <div class="profile-container">
<div class="backfromprofile"><button><i class="fa-solid fa-arrow-left"></i> back</button></div>

    <div class="card">
      
      <div class="top">

        <div class="profilecon"><div class="profile"></div></div>
        <div class="email"><p>my email</p></div>
        <div class="signout"><button>signout</button></div>
    
    
      </div>
      <div class="middle">
         <div class="Account">
          <h2>Account</h2>
          <div><h6>Email</h6><button class="updateemail">Update Email</button></div>
          <div><h6>Password</h6><button class="updatepassword">Update Password</button></div>
          <div><h6>Profile</h6><button class="updateprofile">Update profile</button></div>
         </div>
         
         <div class="Privacy">
          <h2>Privacy</h2>  
           
          <div><h6>Terms of service</h6><button>View</button></div>
          <div><h6>Policies</h6><button>View</button></div>

         </div>

         
      </div>
      <div class="delete-account"><button><span><i class="fa-solid fa-trash-can" style="color:white"></i></span>Delete Account</button></div>

    </div>







    

  <div class="email-update-popup">

       <div class="email-update">

         <div class="top-email-update">Update  email<button class="close-update-email"><i class="fa-solid fa-circle-xmark iconsecondmain"></i></button></div>
         <p id="inf1">Enter current email and verify your new email</p>


         <div class="email-update-inputs">
        <label>Current email</label>
         <div class="present-email">
          <i class="fa-solid fa-clock-rotate-left icongray400"></i>
          <input id="present-email-input" placeholder="present@gmail.com">
         </div>
        <label>New email</label>
           <div class="new-email">
        <i class="fa-regular fa-star icongray400"></i>
          <input id="present-email-input" placeholder="new@gmail.com">
         
         </div>
         <div class="email-update-error"></div>
         <button class="update-email-btn">Update</button>
         </div>


       </div>
      
  
  
  
  
      </div>
             <div class="password-update-popup">

       <div class="password-update">

         <div class="top-password-update">Update  email<button class="close-update-password"><i class="fa-solid fa-circle-xmark iconsecondmain"></i></button></div>
         <p id="inf1">Enter current password and verify your new password</p>


         <div class="password-update-inputs">
        <label>Current password</label>
         <div class="present-password">
          <i class="fa-solid fa-clock-rotate-left icongray400"></i>
          <input id="present-email-input" placeholder="oldpassword123">
         </div>
        <label>New password</label>
           <div class="new-password">
        <i class="fa-regular fa-star icongray400"></i>
          <input id="present-password-input" placeholder="newpassword123">
         
         </div>
         <div class="password-update-error"></div>
         <button class="update-password-btn">Update</button>
         </div>



       </div>


  </div>


<div class="profile-update-popup">
         <div class="profile-update">
<button class="close-profile-update"><i class="fa-solid fa-circle-xmark iconsecondmain"></i></button>

          <div class="profile-display-con">
           <div class="profile-display"> <input type="file" class="profile-input"></div>
           <span><i class="fa-solid fa-hand-pointer iconsecondmain"></i></span>
          </div>


          <button class="change-profile-btn">Change</button>

         </div>
</div>

       <div class="delete-account-popup">
        
        <form >
          <button class="close-delete"><i class="fa-solid fa-circle-xmark iconsecondmain"></i></button>
          <p>Are you sure you want to delete this accountjllg?</p>
           <label class="why-label">Why(Optional)</label>
          <input type="text" placeholder="Reason for deletion">
          <button class="validate-deletion-btn" type="submit">Delete</button>
        </form>
       </div>
    
    
      </div>
<script type="module" src="../javascript/settingPopups.js"></script>

</body>
</html>
