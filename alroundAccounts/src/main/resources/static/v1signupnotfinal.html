<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signature</title>
  <script src="https://kit.fontawesome.com/1c25584323.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="notfinaksignup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">

</head>

<body>
 <div class="container">
    <div class="signup">
              <div class="close"><i class="fa-solid fa-circle-xmark iconsecondmain"></i></div>
      <div class="top">
        <div class="logo"></div>

      </div>

    <div class="info">
      <h4 id="inf1">sign up</h4>
      <p id="inf2">Enter your email, password and birth date to create<br> your own alround Account</p>
    </div>
   
    <div class="inputs" autocorrect="off">
      <div class="email"><i class="fa-solid fa-envelope icondeepmain"></i><input id="email" type="email" placeholder="alround@gmail.com"></div>
      
      <div class="password"><i class="fa-solid fa-lock icondeepmain"></i><input type="password" id="password" placeholder="password"></div>
      
      <div class="birthdate"><i class="fa-solid fa-calendar icondeepmain"></i><input type="date" id="birthdate" placeholder="dd/mm/yyyy"></div>
      
      <a id="forgotpassword">Forgot password?</a><br>
      
      <button onclick="signup()" type="button
      
      
      
      
      
      
      I">Continue</button><br>
      
      <p id="inf3">already have a account?</p>
    </div>
    
     <div class="buttons">
       <button id="gotologin">login</button>
       <button><i class="fa-brands fa-apple"></i>Continue with apple</button>
       <button><i class="fa-brands fa-google"></i>Continue with google</button>
     </div>
    </div>
   
     <a href="" id="inf4"><span>By clicking "Continue",I agree and read<br></span>Term sheet,Privacy policy</a>

 </div>  

 <script>
  class message{
    constructor(){
      this.ok=this.ok(),
      this.error=this.error()
    }
    ok(){
      function okdiv(){ 
      const okdiv=document.createElement("div");
      okdiv.style.position="absolute";
      okdiv.style.height="50px";
      okdiv.style.width="200px";
      okdiv.style.borderRadius="10px";
      okdiv.style.boxShadow="2px 2px 100px rgb(200,200,200)";
      okdiv.textContent="Success!";
      okdiv.style.color="lime";
      okdiv.style.backgroundColor="white";
      okdiv.style.top="0";
      okdiv.style.transform="translateY(-100px)";
      okdiv.style.transition="all 0.3s ease-in-out";
      okdiv.style.display="flex";
      okdiv.style.alignItems="center";
      okdiv.style.justifyContent="space-evenly";
      
      const closeok=document.createElement("button");
      closeok.textContent="x";
      closeok.style.width="30px";
      closeok.style.height="30px";
      closeok.style.borderRadius="15px";
      closeok.style.backgroundColor="lime";
      closeok.style.color="white";
      closeok.style.border="none";
      closeok.style.display="grid";
      closeok.style.placeItems="center";
      closeok.style.cursor="pointer";
      
      closeok.addEventListener("click",()=>{
        okdiv.style.transform="translateY(-100px)";
      })
      
       okdiv.append(closeok);
       
      return okdiv;
    }

      return okdiv();
    }
        error(){
      function errordiv(){ 
      const errordiv=document.createElement("div");
      errordiv.style.position="absolute";
      errordiv.style.height="50px";
      errordiv.style.width="200px";
      errordiv.style.borderRadius="10px";
      errordiv.style.boxShadow="2px 2px 100px rgb(200,200,200)";
      errordiv.textContent="Error ?";
      errordiv.style.color="red";
      errordiv.style.backgroundColor="white";
      errordiv.style.top="0";
      errordiv.style.transform="translateY(-100px)";
      errordiv.style.transition="all 0.3s ease-in-out";
      errordiv.style.display="flex";
      errordiv.style.alignItems="center";
      errordiv.style.justifyContent="space-evenly";
      
      const closeerror=document.createElement("button");
      closeerror.textContent="x";
      closeerror.style.width="30px";
      closeerror.style.height="30px";
      closeerror.style.borderRadius="15px";
      closeerror.style.backgroundColor="red";
      closeerror.style.color="white";
      closeerror.style.border="none";
      closeerror.style.display="grid";
      closeerror.style.placeItems="center";
      closeerror.style.cursor="pointer";
      
      closeerror.addEventListener("click",()=>{
        errordiv.style.transform="translateY(-100px)";
      })
      
       errordiv.append(closeerror);
       
      return errordiv;
    }

      return errordiv();
    }
  }

  const el={
    container:document.querySelector(".container"),
    email:document.querySelector("#email"),
    password:document.querySelector("#password"),
    birthdate:document.querySelector("#birthdate"),
  }

async function signup(){
try{const res=await fetch("http://localhost:8080/signup",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
      },
      body:JSON.stringify({
        "email":el.email.value,
        "password":el.password.value,
        "birthdate":el.birthdate.value,
          })
     });
    
  if(!res.ok){
   throw new Error("fail");
  }

 const data=await res.json();
  if(data.message=="success"){
    console.log("success");
    window.location.href="google.com"
  }else{
    console.log(data.message,data);
  }

     const errorInts=new message();
     const okMeth=errorInts.ok;
      okMeth.style.transform="translateY(50px)";
     el.container.append(okMeth);

}catch(error){
     const errorInts=new message();
     const errorMeth=errorInts.error;
      errorMeth.style.transform="translateY(50px)";
     el.container.append(errorMeth);
}

  }


 </script>

</body>
</html>
