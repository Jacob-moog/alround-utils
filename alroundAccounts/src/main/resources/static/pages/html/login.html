<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome back</title>
  <script src="https://kit.fontawesome.com/1c25584323.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="/pages/css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">

</head>

<body>
 <div class="container">
    <div class="login">
              <div class="close"><a href="/home"><i class="fa-solid fa-circle-xmark iconsecondmain"></i></a></div>
      <div class="top">
        <div class="logo"></div>

      </div>

    <div class="info">
      <h4 id="inf1">login</h4>
      <p id="inf2">Welcome back!</p>
    </div>
  
    

    <form class="inputs" action="/login" method="post" autocorrect="off">
      <div class="email"><i class="fa-solid fa-envelope icondeepmain"></i><input id="email" name="email" type="email" placeholder="alround@gmail.com"></div>
      
      <div class="password"><i class="fa-solid fa-lock icondeepmain"></i><input type="password" name="password" id="password" placeholder="password"></div>
          
      <span id="forgotpassword">forgot password?</span><br>
      
      <button type="submit">Continue</button><br>
      
      <p id="inf3">Don't have a account?</p>
    </form>
  
    

     <div class="buttons">
    <a href="/join"><button id="gotosignup">sign up</button></a>
     </div>
     
    </div>
   
     <a href="/terms" id="inf4"><span>By clicking "Continue",I agree and read<br></span>Term sheet,Privacy policy</a>
  <div class="forgot-password-popup">

       <div class="forgot-password">

         <div class="top-forgot-password">Forgot password<button class="close-forgot-password"><i class="fa-solid fa-circle-xmark iconsecondmain"></i></button></div>
         <p id="inf1">Enter current email</p>


         <div class="forgot-password-inputs">
        <label>Current email</label>
         <div class="present-email">
          <i class="fa-solid fa-clock-rotate-left icongray400"></i>
          <input id="present-email-input" placeholder="present@gmail.com">
         </div>

         <div class="forgot-password-error"></div>
         <button class="forgot-password-btn">Send</button>
         <div class="code-input">
        <div class="code-input-top"><h6>Enter verification code</h6></div>
         <div class="code-input-middle">
           
          <span><input type="text" name="" id="" maxlength="1" pattern="[0-9]+"></span>
          <span><input type="text" name="" id="" maxlength="1" pattern="[0-9]+"></span>
          <span><input type="text" name="" id="" maxlength="1" pattern="[0-9]+"></span>
          <span><input type="text" name="" id="" maxlength="1" pattern="[0-9]+"></span>
         </div>
        <div class="code-varification-btn"><button>Verify</button></div>
         
        </div>
         </div>


       </div>
      
 </div>  

 <script>
  const el={
    container:document.querySelector(".container"),
    email:document.querySelector("#email"),
    password:document.querySelector("#password"),
    forgotpasswordbtn:document.querySelector(".forgot-password-btn"),
    forgotpasswordpopup:document.querySelector(".forgot-password-popup"),
    closeforgotpassword:document.querySelector(".close-forgot-password"),
    codeinput:document.querySelector(".code-input"),
    forgotpassword:document.querySelector("#forgotpassword"),
  }

const toggleForgotPasswordPop=()=>{
  if(getComputedStyle(el.forgotpasswordpopup).display=="none"){
    el.forgotpasswordpopup.style.display="grid"
  }else{
    el.forgotpasswordpopup.style.display="none";
  }
}
const togglevarification=()=>{
  if(getComputedStyle(el.codeinput).display=="none"){
  el.codeinput.style.display="flex";
  }else{
   return;
  }
}
el.forgotpassword.addEventListener("click",()=>{
  toggleForgotPasswordPop();
  console.log("click")
})
el.closeforgotpassword.addEventListener("click",()=>{
   toggleForgotPasswordPop();

})
el.forgotpasswordbtn.addEventListener("click",()=>{
  togglevarification();
})
async function login(){
  console.log("...")
  const res=await fetch("/login",{
    method:"POST",
    headers:{
      "Content-Type":"application/x-www-form-urlencoded",
    },
    body:new URLSearchParams({
      email:el.email.value,
      password:el.password.value,
    }),
    credentials:"same-origin",
  })
  
 
  
}
  


 </script>

</body>
</html>
