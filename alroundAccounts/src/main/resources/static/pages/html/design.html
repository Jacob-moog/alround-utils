  <style>
    section{
      margin:20px;
    }
    :root{
      --alrcl:#a440b1;
    }

<body>

  <div class="circle10 moveX-5 td1s inf" style="background-color: var(--alrcl);"></div>

  <div class="circle10 moveX-18 td1s inf" style="background-color: var(--alrcl);"></div>

  <div class="circle10 moveX-18 td1s inf" style="background-color: var(--alrcl);"></div>
  </span>

  <span style="display: flex;">

  <div class="circle10 moveup-10 td1s inf" style="background-color: var(--alrcl);"></div>
  </span>

  <span class="" style="display: flex;flex-direction: column;">    
    <div style="display: flex;">

    </div>

    <div style="display: flex;">    
    <div class="circle10 moveup-10 td1s inf" style="background-color: var(--alrcl);"></div>
    <div class="circle10 moveup-10 td1s inf" style="background-color:var(--alrcl);"></div>
    <div class="circle10 moveup-10 td1s inf" style="background-color: var(--alrcl);"></div>
    </div>
  </span >


  
  <span>
     <div class="circle10 flip360 td1s inf" style="border-top: 4px solid var(--alrcl);border-left: 4px solid var(--alrcl);border-bottom: 4px solid var(--alrcl);border-right: 4px solid transparent;"></div>
  </span>
